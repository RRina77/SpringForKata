<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Admin Panel</title>
    <link rel="stylesheet"
          href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">
</head>
<body>
<!-- Верхняя панель -->
<nav class="navbar navbar-dark bg-dark">
    <span class="navbar-text text-white">
        <strong th:text="${currentUser.username}"></strong>
        <span th:each="role : ${currentUser.roles}"
              th:text="${role.name + ' '}"></span>
    </span>

    <form th:action="@{/logout}" method="post" class="mb-0">
        <input type="hidden"
               th:name="${_csrf.parameterName}"
               th:value="${_csrf.token}">
        <button type="submit"
                class="btn btn-link text-secondary">
            Logout
        </button>
    </form>
</nav>
<!-- Левая панель -->
<div class="container-fluid">
    <div class="row mt-3">
        <div class="col-2 mt-3">
            <ul class="nav nav-pills flex-column">
                <li class="nav-item">
                    <a class="nav-link active" th:href="@{/admin}">Admin</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/user}">User</a>
                </li>
            </ul>
        </div>

        <!-- Основная панель -->
        <div class="col-10">
            <h1 class="mt-3">Admin Panel</h1>

            <ul class="nav nav-tabs mt-3">
                <li class="nav-item">
                    <a class="nav-link active" th:href="@{/admin}">
                        Users table
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/admin/new}">
                        New User
                    </a>
                </li>
            </ul>

            <table class="table table-striped table-bordered">
                <thead>
                <tr>
                    <th>ID</th>
                    <th>First Name</th>
                    <th>Last Name</th>
                    <th>Age</th>
                    <th>Email</th>
                    <th>Role</th>
                    <th>Edit</th>
                    <th>Delete</th>
                </tr>
                </thead>


                <tbody>
                <tr th:each="u : ${users}">
                    <td th:text="${u.id}"></td>
                    <td th:text="${u.firstName}"></td>
                    <td th:text="${u.lastName}"></td>
                    <td th:text="${u.age}"></td>
                    <td th:text="${u.email}"></td>
                    <td>
            <span th:each="role : ${u.roles}"
                  th:text="${role.name + ' '}"></span>
                    </td>
                    <td>
                        <button type="button"
                                class="btn btn-info btn-sm"
                                data-toggle="modal"
                                th:attr="data-target='#editModal-' + ${u.id}">
                            Edit
                        </button>
                    </td>
                    <td>
                        <button type="button"
                                class="btn btn-danger btn-sm"
                                data-toggle="modal"
                                th:attr="data-target='#deleteModal-' + ${u.id}">
                            Delete
                        </button>
                    </td>
                </tr>
                </tbody>
            </table>
            <!-- Окна редактирования пользователей -->
            <div th:each="u : ${users}"
                 class="modal fade"
                 th:id="'editModal-' + ${u.id}"
                 tabindex="-1"
                 role="dialog">

                <div class="modal-dialog" role="document">
                    <div class="modal-content">

                        <div class="modal-header">
                            <h5 class="modal-title">Edit user</h5>
                            <button type="button" class="close"
                                    data-dismiss="modal">
                                <span>&times;</span>
                            </button>
                        </div>

                        <form th:action="@{/admin/{id}(id=${u.id})}"
                              method="post">

                            <div class="modal-body">

                                <input type="hidden"
                                       th:name="${_csrf.parameterName}"
                                       th:value="${_csrf.token}">

                                <!-- Сохраняем имя для авторизации -->
                                <input type="hidden" name="username"
                                       th:value="${u.username}">

                                <div class="form-group text-center">
                                    <label>ID</label>
                                    <input class="form-control mx-auto"
                                           style="width: 250px;"
                                           th:value="${u.id}" disabled>
                                </div>

                                <div class="form-group text-center">
                                    <label><strong>First name</strong></label>
                                    <input type="text" name="firstName"
                                           class="form-control mx-auto"
                                           style="width: 250px;"
                                           th:value="${u.firstName}" required>
                                </div>

                                <div class="form-group text-center">
                                    <label><strong>Last name</strong></label>
                                    <input type="text" name="lastName"
                                           class="form-control mx-auto"
                                           style="width: 250px;"
                                           th:value="${u.lastName}" required>
                                </div>

                                <div class="form-group text-center">
                                    <label><strong>Age</strong></label>
                                    <input type="number" name="age"
                                           class="form-control mx-auto"
                                           style="width: 250px;"
                                           th:value="${u.age}" required>
                                </div>

                                <div class="form-group text-center">
                                    <label><strong>Email</strong></label>
                                    <input type="email" name="email"
                                           class="form-control mx-auto"
                                           style="width: 250px;"
                                           th:value="${u.email}" required>
                                </div>

                                <div class="form-group text-center">
                                    <label><strong>Password</strong></label>
                                    <input type="password" name="password"
                                           class="form-control mx-auto"
                                           style="width: 250px;"
                                           autocomplete="new-password">
                                </div>

                                <!-- Выбор Доступа -->
                                <div class="form-group text-center">
                                    <label for="roles"><strong>Role</strong></label>

                                    <select id="roles"
                                            name="roleIds"
                                            class="form-control mx-auto"
                                            style="width: 200px;"
                                            multiple
                                            size="2">

                                        <option th:each="role : ${roles}"
                                                th:value="${role.id}"
                                                th:text="${role.name}"
                                                th:selected="${u.roles.contains(role)}">
                                        </option>

                                    </select>
                                </div>

                            </div>

                            <div class="modal-footer">
                                <button type="button"
                                        class="btn btn-secondary"
                                        data-dismiss="modal">
                                    Close
                                </button>

                                <button type="submit"
                                        class="btn btn-primary">
                                    Edit
                                </button>
                            </div>

                        </form>
                    </div>
                </div>
            </div>

            <!-- Окна удаления пользователей -->
            <div th:each="u : ${users}"
                 class="modal fade"
                 th:id="'deleteModal-' + ${u.id}"
                 tabindex="-1"
                 role="dialog">

                <div class="modal-dialog" role="document">
                    <div class="modal-content">

                        <div class="modal-header">
                            <h5 class="modal-title">Delete user</h5>
                            <button type="button" class="close"
                                    data-dismiss="modal">
                                <span>&times;</span>
                            </button>
                        </div>

                        <form th:action="@{/admin/{id}/delete(id=${u.id})}"
                              method="post">

                            <div class="modal-body">

                                <input type="hidden"
                                       th:name="${_csrf.parameterName}"
                                       th:value="${_csrf.token}">

                                <div class="form-group text-center">
                                    <label><strong>ID</strong></label>
                                    <input class="form-control mx-auto"
                                           style="width: 250px;"
                                           th:value="${u.id}" disabled>
                                </div>

                                <div class="form-group text-center">
                                    <label><strong>First name</strong></label>
                                    <input class="form-control mx-auto"
                                           style="width: 250px;"
                                           th:value="${u.firstName}" disabled>
                                </div>

                                <div class="form-group text-center">
                                    <label><strong>Last name</strong></label>
                                    <input class="form-control mx-auto"
                                           style="width: 250px;"
                                           th:value="${u.lastName}" disabled>
                                </div>

                                <div class="form-group text-center">
                                    <label><strong>Age</strong></label>
                                    <input class="form-control mx-auto"
                                           style="width: 250px;"
                                           th:value="${u.age}" disabled>
                                </div>

                                <div class="form-group text-center">
                                    <label><strong>Email</strong></label>
                                    <input class="form-control mx-auto"
                                           style="width: 250px;"
                                           th:value="${u.email}" disabled>
                                </div>

                                <div class="form-group text-center">
                                    <label><strong>Role</strong></label>

                                    <select class="form-control mx-auto"
                                            style="width: 250px;"
                                            multiple size="2" disabled>

                                        <option th:each="role : ${u.roles}"
                                                th:value="${role.id}"
                                                th:text="${role.name}"
                                                selected>
                                        </option>
                                    </select>
                                </div>

                            </div>

                            <div class="modal-footer">
                                <button type="button"
                                        class="btn btn-secondary"
                                        data-dismiss="modal">
                                    Close
                                </button>

                                <button type="submit"
                                        class="btn btn-danger">
                                    Delete
                                </button>
                            </div>

                        </form>
                    </div>
                </div>
            </div>


        </div>

        </div>
    </div>
</div>
<script src="https://code.jquery.com/jquery-3.3.1.slim.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.14.7/umd/popper.min.js"></script>
<script src="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/js/bootstrap.min.js"></script>
</body>
</html>
