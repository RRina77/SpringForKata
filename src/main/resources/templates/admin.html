<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Панель администратора</title>
</head>
<body>

<h1>Панель администратора</h1>

<h2>Информация об администраторе</h2>

<p>
    Имя пользователя:
    <span th:text="${currentUser.username}"></span>
</p>

<p>
    Роли:
    <span th:each="role, iter : ${currentUser.roles}">
        <span th:text="${role.name}"></span>
        <span th:if="${!iter.last}"> </span>
    </span>
</p>

<h2>Список пользователей</h2>

<p>
    <a th:href="@{/admin/new}">Добавить пользователя</a>
</p>

<table border="1" cellpadding="8">
    <thead>
    <tr>
        <th>ID</th>
        <th>Имя пользователя</th>
        <th>Роли</th>
        <th>Действия</th>
    </tr>
    </thead>


    <tbody>
    <tr th:each="u : ${users}">
        <td th:text="${u.id}"></td>
        <td th:text="${u.username}"></td>
        <td>
            <span th:each="role : ${u.roles}"
                  th:text="${role.name + ' '}"></span>
        </td>
        <td>
            <a th:href="@{/admin/{id}/edit(id=${u.id})}">Изменить</a>

            <form th:action="@{/admin/{id}/delete(id=${u.id})}"
                  method="post"
                  style="display:inline">
                <input type="hidden"
                       th:name="${_csrf.parameterName}"
                       th:value="${_csrf.token}">
                <button type="submit">Удалить</button>
            </form>
        </td>
    </tr>
    </tbody>
</table>

<form th:action="@{/logout}" method="post">
    <input type="hidden"
           th:name="${_csrf.parameterName}"
           th:value="${_csrf.token}">
    <button type="submit">Выйти</button>
</form>

</body>
</html>
