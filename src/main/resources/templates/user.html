<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>User Page</title>
    <link rel="stylesheet"
          href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">
</head>
<body>

<!-- Верхняя панель -->
<nav class="navbar navbar-dark bg-dark">
    <span class="navbar-text text-white">
        <strong th:text="${currentUser.email}"></strong>
        <span>with roles:</span>
        <span th:each="role : ${currentUser.roles}"
              th:text="${role.name + ' '}"></span>
    </span>

    <form th:action="@{/logout}" method="post" class="mb-0">
        <input type="hidden"
               th:name="${_csrf.parameterName}"
               th:value="${_csrf.token}">
        <button type="submit"
                class="btn btn-link text-secondary">
            Logout
        </button>
    </form>
</nav>

<!-- Основная область -->
<div class="container-fluid">
    <div class="row mt-3">

        <!-- Левая панель -->
        <div class="col-2 mt-3">
            <ul class="nav nav-pills flex-column">
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/admin}">Admin</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link active" th:href="@{/user}">User</a>
                </li>
            </ul>
        </div>

        <!-- Информация о пользователе -->
        <div class="col-10">
            <h1 class="mt-3">User information-page</h1>

            <h5 class="mb-0"
                th:text="${currentUser.authorities.?[authority == 'ROLE_ADMIN'].size() > 0
        ? 'All users'
        : 'About user'}">
            </h5>

                <div class="card-body">
                    <table class="table table-striped table-bordered">
                        <thead>
                        <tr>
                            <th>ID</th>
                            <th>First Name</th>
                            <th>Last Name</th>
                            <th>Age</th>
                            <th>Email</th>
                            <th>Role</th>
                        </tr>
                        </thead>

                        <tbody>
                        <tr th:each="u : ${users}">
                            <td th:text="${u.id}"></td>
                            <td th:text="${u.firstName}"></td>
                            <td th:text="${u.lastName}"></td>
                            <td th:text="${u.age}"></td>
                            <td th:text="${u.email}"></td>
                            <td>
                            <span th:each="role : ${u.roles}"
                                  th:text="${role.name + ' '}"></span>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

    </div>
</div>

<script src="https://code.jquery.com/jquery-3.3.1.slim.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.14.7/umd/popper.min.js"></script>
<script src="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/js/bootstrap.min.js"></script>

</body>
</html>
