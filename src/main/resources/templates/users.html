<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Users</title>
    <style>
        body {
        background-color: beige;
        }
        table {
        border-collapse: collapse;
        }

        h1{
        color: brown;
        }

        a {
        background-color: beige;
        color: brown;
        }

        button {
        background-color: beige;
        color: brown;
        }

        th {
        border: 2px solid brown;
        padding: 20px;
        }
        td {
        border: 2px solid brown;
        padding: 20px;
        }
        tr {
        color: brown;
}
    </style>
</head>
<body>

<h1>Users</h1>

<table>
    <tr>
        <th>ID</th>
        <th>Name</th>
        <th>Email</th>
        <th>Actions</th>
    </tr>

    <tr th:each="user : ${users}">
        <td th:text="${user.id}"></td>
        <td th:text="${user.name}"></td>
        <td th:text="${user.email}"></td>

        <td>
            <a th:href="@{/users/edit(id=${user.id})}">Edit</a>

            <form th:action="@{/users/delete}" method="post" style="display:inline;">
                <input type="hidden" name="id" th:value="${user.id}">
                <button type="submit">Delete</button>
            </form>
        </td>
    </tr>
</table>
<h2>Edit user</h2>

<form th:if="${user != null}" th:action="@{/users/update}" method="post">

    <input type="hidden" name="id" th:value="${user.id}">

    <label>Name:</label>
    <input type="text" name="name" th:value="${user.name}" required>

    <label>Email:</label>
    <input type="email" name="email" th:value="${user.email}" required>

    <button type="submit">Update</button>
</form>

</body>
</html>
